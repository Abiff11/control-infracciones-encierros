services:
  postgres_infracciones:
    image: postgres:16-alpine
    container_name: cie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_infracciones_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infracciones_net

  infracciones_api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-production
    image: control-infracciones-api:${APP_VERSION:-latest}
    container_name: cie_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres_infracciones
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: ${DB_LOGGING:-false}
      DB_MAX_QUERY_EXECUTION_TIME: ${DB_MAX_QUERY_EXECUTION_TIME:-500}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      postgres_infracciones:
        condition: service_healthy
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp
    networks:
      - infracciones_net

  infracciones_web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: control-infracciones-web:${APP_VERSION:-latest}
    container_name: cie_web
    restart: unless-stopped
    depends_on:
      - infracciones_api
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - infracciones_net

volumes:
  postgres_infracciones_data:

networks:
  infracciones_net:
    driver: bridge
