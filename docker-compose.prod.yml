services:
  postgres_infracciones:
    image: postgres:16-alpine
    container_name: cie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_infracciones_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infracciones_net

  infracciones_api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-production
    image: control-infracciones-api:${APP_VERSION:-latest}
    container_name: cie_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres_infracciones
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: ${DB_LOGGING:-false}
      DB_MAX_QUERY_EXECUTION_TIME: ${DB_MAX_QUERY_EXECUTION_TIME:-500}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-5000}
      CACHE_QUERY_ENABLED: ${CACHE_QUERY_ENABLED:-false}
      CACHE_QUERY_DURATION_MS: ${CACHE_QUERY_DURATION_MS:-30000}
      JWT_SECRET: ${JWT_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN_MINUTES: ${REFRESH_TOKEN_EXPIRES_IN_MINUTES:-60}
      REFRESH_COOKIE_MODE: ${REFRESH_COOKIE_MODE:-session}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCK_MINUTES: ${AUTH_LOCK_MINUTES:-15}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      ENABLE_EXCEL_IMPORT: ${ENABLE_EXCEL_IMPORT:-false}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-60000}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-10}
      THROTTLE_DEFAULT_TTL_MS: ${THROTTLE_DEFAULT_TTL_MS:-60000}
      THROTTLE_DEFAULT_LIMIT: ${THROTTLE_DEFAULT_LIMIT:-120}
      THROTTLE_READ_TTL_MS: ${THROTTLE_READ_TTL_MS:-60000}
      THROTTLE_READ_LIMIT: ${THROTTLE_READ_LIMIT:-240}
      THROTTLE_WRITE_TTL_MS: ${THROTTLE_WRITE_TTL_MS:-60000}
      THROTTLE_WRITE_LIMIT: ${THROTTLE_WRITE_LIMIT:-80}
      THROTTLE_AUTH_TTL_MS: ${THROTTLE_AUTH_TTL_MS:-60000}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-20}
      THROTTLE_REFRESH_TTL_MS: ${THROTTLE_REFRESH_TTL_MS:-60000}
      THROTTLE_REFRESH_LIMIT: ${THROTTLE_REFRESH_LIMIT:-60}
      THROTTLE_REPORT_TTL_MS: ${THROTTLE_REPORT_TTL_MS:-60000}
      THROTTLE_REPORT_LIMIT: ${THROTTLE_REPORT_LIMIT:-20}
      THROTTLE_IMPORT_TTL_MS: ${THROTTLE_IMPORT_TTL_MS:-60000}
      THROTTLE_IMPORT_LIMIT: ${THROTTLE_IMPORT_LIMIT:-5}
      THROTTLE_UPLOAD_TTL_MS: ${THROTTLE_UPLOAD_TTL_MS:-60000}
      THROTTLE_UPLOAD_LIMIT: ${THROTTLE_UPLOAD_LIMIT:-5}
      THROTTLE_SEARCH_TTL_MS: ${THROTTLE_SEARCH_TTL_MS:-60000}
      THROTTLE_SEARCH_LIMIT: ${THROTTLE_SEARCH_LIMIT:-60}
    depends_on:
      postgres_infracciones:
        condition: service_healthy
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp
    networks:
      - infracciones_net

  infracciones_web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: control-infracciones-web:${APP_VERSION:-latest}
    container_name: cie_web
    restart: unless-stopped
    depends_on:
      - infracciones_api
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - infracciones_net

volumes:
  postgres_infracciones_data:

networks:
  infracciones_net:
    driver: bridge
