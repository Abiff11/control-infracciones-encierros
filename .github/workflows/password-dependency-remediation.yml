name: Password dependency remediation

on:
  push:
    branches:
      - feature/security-password-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-argon2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/infracciones-api

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/security-password-hardening

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/infracciones-api/package-lock.json

      - name: Install pinned Argon2 dependency
        run: npm install --save-exact argon2@0.45.1

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Commit package manifests if changed
        working-directory: .
        run: |
          if git diff --quiet -- backend/infracciones-api/package.json backend/infracciones-api/package-lock.json; then
            echo "No package manifest changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/infracciones-api/package.json backend/infracciones-api/package-lock.json
          git commit -m "security: add argon2 password hashing dependency"
          git push origin HEAD:feature/security-password-hardening
