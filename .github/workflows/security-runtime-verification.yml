name: Security runtime verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-security:
    name: Runtime negative security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: control_infracciones_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_infracciones_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/infracciones-api

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: control_infracciones_db
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      JWT_SECRET: ci_runtime_jwt_secret_2026_at_least_32_chars
      CSRF_SECRET: ci_runtime_csrf_secret_2026_distinct_32_chars
      JWT_EXPIRES_IN: 15m
      CORS_ORIGIN: http://127.0.0.1:4173
      ENABLE_SWAGGER: "false"
      ENABLE_EXCEL_IMPORT: "false"
      TRUST_PROXY: 10.200.0.0/16
      LOGIN_RATE_LIMIT_WINDOW_MS: 60000
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: 6
      AUTH_MAX_FAILED_ATTEMPTS: 20
      AUTH_LOCK_MINUTES: 15
      SECURITY_TEST_ADMIN_EMAIL: security-admin@example.com
      SECURITY_TEST_ADMIN_PASSWORD: Runtime-Admin-Password-2026!
      SECURITY_TEST_CONSULTA_EMAIL: security-consulta@example.com
      SECURITY_TEST_CONSULTA_PASSWORD: Runtime-Consulta-Password-2026!

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/infracciones-api/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run migrations
        run: npm run migration:run

      - name: Seed base catalogs and roles
        run: npm run seed:initial

      - name: Seed ADMIN security user
        env:
          ADMIN_EMAIL: security-admin@example.com
          ADMIN_PASSWORD: Runtime-Admin-Password-2026!
          ADMIN_NOMBRE: Security Admin
          ADMIN_ROL: ADMIN
        run: npm run seed:admin

      - name: Seed CONSULTA security user
        env:
          ADMIN_EMAIL: security-consulta@example.com
          ADMIN_PASSWORD: Runtime-Consulta-Password-2026!
          ADMIN_NOMBRE: Security Consulta
          ADMIN_ROL: CONSULTA
        run: npm run seed:admin

      - name: Start API and run negative security smoke
        run: |
          set -Eeuo pipefail
          API_LOG="$RUNNER_TEMP/security-runtime-api.log"

          npm run start:prod >"$API_LOG" 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [[ "$READY" != "1" ]]; then
            echo "API no quedo lista para la verificacion de seguridad" >&2
            cat "$API_LOG" >&2 || true
            exit 1
          fi

          STATUS=0
          bash ../../scripts/security/runtime-security-smoke.sh http://127.0.0.1:3000 || STATUS=$?

          if [[ "$STATUS" != "0" ]]; then
            echo "--- API log ---" >&2
            cat "$API_LOG" >&2 || true
            exit "$STATUS"
          fi

      - name: Confirm migrations remain applied
        run: npm run migration:show
