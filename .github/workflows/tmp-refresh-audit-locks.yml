name: Temporary refresh audit lockfiles

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-refresh-audit-locks.yml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/control-operativo-clave-concepto

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh backend lockfile security fixes
        working-directory: backend/infracciones-api
        run: npm audit fix --package-lock-only --audit-level=high

      - name: Refresh frontend lockfile security fixes
        working-directory: frontend/infracciones-web
        run: npm audit fix --package-lock-only --audit-level=high

      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/infracciones-api/package-lock.json frontend/infracciones-web/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git commit -m "chore(deps): refresh audited lockfiles"
          git push origin HEAD:feat/control-operativo-clave-concepto
