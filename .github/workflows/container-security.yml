name: Container security

on:
  push:
    branches:
      - main
      - feature/security-supply-chain
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 14 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-image:
    name: Backend image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build production backend image
        run: docker build --target api-production -t control-infracciones-backend:security-scan .

      - name: Verify minimal read-only backend runtime
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/tmp:rw,noexec,nosuid,size=64m \
            --pids-limit 128 \
            control-infracciones-backend:security-scan sh -lc '
              test ! -e /usr/local/bin/npm
              test ! -e /usr/local/bin/npx
              test ! -e /usr/local/bin/corepack
              test ! -e /usr/local/bin/yarn
              node ./node_modules/typeorm/cli.js --version >/dev/null
            '

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: control-infracciones-backend:security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  frontend-image:
    name: Frontend image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build production frontend image
        run: docker build --target web-production -t control-infracciones-frontend:security-scan .

      - name: Validate read-only Nginx configuration
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=16m \
            --tmpfs /var/run:rw,noexec,nosuid,size=4m \
            --pids-limit 64 \
            control-infracciones-frontend:security-scan nginx -t

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: control-infracciones-frontend:security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
