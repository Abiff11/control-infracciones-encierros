name: One-time backend security lock refresh

on:
  push:
    branches:
      - feature/security-supply-chain
    paths:
      - backend/infracciones-api/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh backend package lock
    if: github.ref == 'refs/heads/feature/security-supply-chain'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/security-supply-chain

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh exact backend dependency graph
        working-directory: backend/infracciones-api
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- backend/infracciones-api/package-lock.json; then
            echo "No backend lockfile changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/infracciones-api/package-lock.json
          git commit -m "security: regenerar lockfile backend"
          git push origin HEAD:feature/security-supply-chain
