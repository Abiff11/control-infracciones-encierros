name: Dashboard feature validation

on:
  push:
    branches:
      - feature/dashboard-analitico
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: control_infracciones_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_infracciones_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/infracciones-api
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: control_infracciones_db
      DB_SYNCHRONIZE: "false"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/infracciones-api/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Lint security and dashboard code without fixes
        run: >-
          npx eslint
          "src/main.ts"
          "src/common/security/**/*.ts"
          "src/modules/auth/**/*.ts"
          "src/modules/auditoria/**/*.ts"
          "src/modules/usuarios/**/*.ts"
          "src/modules/dashboard/**/*.ts"
          "src/database/migrations/1880000000000-AddDashboardAnalyticsIndexes.ts"
          "src/database/migrations/1890000000000-EnsurePagadaSinRetencionStatus.ts"
          "src/database/migrations/1900000000000-AddAuthSessionVersion.ts"
          "src/database/migrations/1910000000000-AddSecurityAuditMetadata.ts"
          --rule 'prettier/prettier: off'

      - name: Run backend tests
        run: npm test -- --runInBand

      - name: Run migrations on disposable PostgreSQL
        run: npm run migration:run

      - name: Assert payment, dashboard, auth and security audit schema
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          async function main() {
            const client = new Client({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT),
              user: process.env.DB_USERNAME,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_DATABASE,
            });

            await client.connect();

            const requiredTables = ['concepto_pago', 'pago_concepto'];
            for (const tableName of requiredTables) {
              const result = await client.query(
                `SELECT to_regclass($1) AS relation`,
                [`public.${tableName}`],
              );
              if (!result.rows[0]?.relation) {
                throw new Error(`No existe la tabla ${tableName}`);
              }
            }

            const paymentColumns = await client.query(`
              SELECT column_name
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'pago_infraccion'
                AND column_name IN ('folio_pago', 'folio_linea_captura')
            `);
            const paymentColumnNames = new Set(paymentColumns.rows.map((row) => row.column_name));
            if (!paymentColumnNames.has('folio_linea_captura') || paymentColumnNames.has('folio_pago')) {
              throw new Error('La migracion de folio linea de captura no quedo aplicada');
            }

            const authColumns = await client.query(`
              SELECT column_name
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'usuarios'
                AND column_name = 'auth_session_version'
            `);
            if (authColumns.rowCount !== 1) {
              throw new Error('No existe auth_session_version en usuarios');
            }

            const securityColumns = await client.query(`
              SELECT column_name
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'auditoria'
                AND column_name = ANY($1)
            `, [['severity', 'request_id', 'http_method', 'request_path', 'user_agent']]);
            const securityColumnNames = new Set(securityColumns.rows.map((row) => row.column_name));
            for (const columnName of ['severity', 'request_id', 'http_method', 'request_path', 'user_agent']) {
              if (!securityColumnNames.has(columnName)) {
                throw new Error(`No existe auditoria.${columnName}`);
              }
            }

            const expectedIndexes = [
              'idx_pago_concepto_concepto_pago_cover',
              'idx_pago_infraccion_dashboard_fecha_cover',
              'idx_retencion_dashboard_latest_encierro',
              'idx_auditoria_entidad_created_at',
              'idx_auditoria_severity_created_at',
              'idx_auditoria_request_id',
            ];
            const indexes = await client.query(
              `SELECT indexname FROM pg_indexes WHERE schemaname = 'public' AND indexname = ANY($1)`,
              [expectedIndexes],
            );
            const indexNames = new Set(indexes.rows.map((row) => row.indexname));
            for (const indexName of expectedIndexes) {
              if (!indexNames.has(indexName)) {
                throw new Error(`No existe el indice ${indexName}`);
              }
            }

            const status = await client.query(
              `SELECT id_estatus_infraccion
               FROM estatus_infraccion
               WHERE nombre_estatus = $1`,
              ['PAGADA_SIN_RETENCION'],
            );
            if (status.rowCount !== 1) {
              throw new Error('No existe el estatus PAGADA_SIN_RETENCION');
            }

            await client.end();
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Revert security, dashboard and payment migrations
        run: |
          npm run migration:revert
          npm run migration:revert
          npm run migration:revert
          npm run migration:revert
          npm run migration:revert
          npm run migration:revert

      - name: Re-run reverted migrations
        run: npm run migration:run

      - name: Show migration state
        run: npm run migration:show

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/infracciones-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/infracciones-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
