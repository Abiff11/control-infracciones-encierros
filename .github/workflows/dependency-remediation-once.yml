name: One-time dependency remediation

on:
  push:
    branches:
      - feature/security-supply-chain
    paths:
      - .github/workflows/dependency-remediation-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dependency-remediation-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    name: Apply semver-compatible audit fixes
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/security-supply-chain') ||
      (github.event_name == 'pull_request' && github.head_ref == 'feature/security-supply-chain')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/security-supply-chain

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Remediate backend lockfile without force
        working-directory: backend/infracciones-api
        run: |
          npm ci
          npm audit fix --package-lock-only

      - name: Remediate frontend lockfile without force
        working-directory: frontend/infracciones-web
        run: |
          npm ci
          npm audit fix --package-lock-only

      - name: Commit lockfile-only changes
        run: |
          if git diff --quiet -- backend/infracciones-api/package-lock.json frontend/infracciones-web/package-lock.json; then
            echo "No lockfile changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/infracciones-api/package-lock.json frontend/infracciones-web/package-lock.json
          git commit -m "security: actualizar dependencias compatibles"
          git push origin HEAD:feature/security-supply-chain
