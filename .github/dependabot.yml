version: 2

updates:
  - package-ecosystem: npm
    directory: /backend/infracciones-api
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-backend)"

  - package-ecosystem: npm
    directory: /frontend/infracciones-web
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-frontend)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/Mexico_City
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-actions)"
